<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>학원 5대 장부 통합 관리 시스템</title>
  <!-- Tailwind CSS & React & Babel & XLSX & Firebase CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-2 md:p-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyArl8_qT9eUfofH9IgK41xtdSPc2DwoB6g",
      authDomain: "simsdrum-33e61.firebaseapp.com",
      databaseURL: "https://simsdrum-33e61-default-rtdb.firebaseio.com",
      projectId: "simsdrum-33e61",
      storageBucket: "simsdrum-33e61.firebasestorage.app",
      messagingSenderId: "797121281913",
      appId: "1:797121281913:web:892c9f4de182799ecfb9a8",
      measurementId: "G-P8VGZ9WZ0K"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch(e) { console.log("Firebase 연결 확인 중...", e); }

    const teacherColorPalette = [
      { bg: "bg-blue-50", border: "border-blue-200", text: "text-blue-700", badge: "bg-blue-100 text-blue-800", dot: "bg-blue-500" },
      { bg: "bg-emerald-50", border: "border-emerald-200", text: "text-emerald-700", badge: "bg-emerald-100 text-emerald-800", dot: "bg-emerald-500" },
      { bg: "bg-purple-50", border: "border-purple-200", text: "text-purple-700", badge: "bg-purple-100 text-purple-800", dot: "bg-purple-500" },
      { bg: "bg-amber-50", border: "border-amber-200", text: "text-amber-700", badge: "bg-amber-100 text-amber-800", dot: "bg-amber-500" },
      { bg: "bg-rose-50", border: "border-rose-200", text: "text-rose-700", badge: "bg-rose-100 text-rose-800", dot: "bg-rose-500" },
      { bg: "bg-cyan-50", border: "border-cyan-200", text: "text-cyan-700", badge: "bg-cyan-100 text-cyan-800", dot: "bg-cyan-500" },
      { bg: "bg-indigo-50", border: "border-indigo-200", text: "text-indigo-700", badge: "bg-indigo-100 text-indigo-800", dot: "bg-indigo-500" },
    ];

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlTeacher = urlParams.get('teacher');
      const isTeacherMode = !!urlTeacher;

      const [activeTab, setActiveTab] = useState(isTeacherMode ? 'timetable' : 'students');
      const [selectedTeacher, setSelectedTeacher] = useState(urlTeacher || '전체');
      
      const [expandedStudentId, setExpandedStudentId] = useState(null);
      const [expandedLogKey, setExpandedLogKey] = useState(null);

      const [editingStudentId, setEditingStudentId] = useState(null);
      const [editStudentData, setEditStudentData] = useState({});

      const [editingStaffId, setEditingStaffId] = useState(null);
      const [editStaffData, setEditStaffData] = useState({});

      const [editingLedgerId, setEditingLedgerId] = useState(null);
      const [editLedgerData, setEditLedgerData] = useState({});

      const [selectedLedgerIds, setSelectedLedgerIds] = useState([]);

      const [rules, setRules] = useState({
        academyName: "심스드럼실용음악학원",
        regNum: "제 1234호",
        courses: [
          { id: 1, teacher: "김드럼", name: "드럼 기초반 (주1회/4회)", fee: 200000, hours: "4회 / 회당 50분" },
          { id: 2, teacher: "박보컬", name: "보컬 취미반 (주1회/4회)", fee: 220000, hours: "4회 / 회당 50분" }
        ]
      });

      const [students, setStudents] = useState([]);
      const [ledger, setLedger] = useState([]);
      const [staff, setStaff] = useState([]);

      const [newCourse, setNewCourse] = useState({ teacher: "", name: "", fee: "", hours: "4회 / 회당 50분" });
      const [newStudent, setNewStudent] = useState({ name: "", phone: "", course: "", teacher: isTeacherMode ? urlTeacher : "", dayOfWeek: "월요일", timeSlot: "14:00" });
      const [newLedger, setNewLedger] = useState({ date: new Date().toISOString().split('T')[0], deposit: "", withdrawal: "", method: "카드", note: "" });
      const [newStaff, setNewStaff] = useState({ name: "", role: "강사", subject: "드럼", hireDate: new Date().toISOString().split('T')[0], checkCrime: true, checkSex: true });

      useEffect(() => {
        if (!db) return;

        const stRef = db.ref('students');
        stRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setStudents(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          else setStudents([]);
        });

        const lgRef = db.ref('ledger');
        lgRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) {
            const list = Object.keys(data).map(k => ({ id: k, ...data[k] }));
            // 날짜 기준 최신순 자동 정렬
            list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            setLedger(list);
          } else {
            setLedger([]);
          }
        });

        const sfRef = db.ref('staff');
        sfRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setStaff(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          else setStaff([]);
        });

        const rlRef = db.ref('rules');
        rlRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setRules(data);
        });

        return () => { stRef.off(); lgRef.off(); sfRef.off(); rlRef.off(); };
      }, []);

      const getTeacherColor = (tName) => {
        if (!tName || tName === '담당 미정') return { bg: "bg-slate-50", border: "border-slate-200", text: "text-slate-600", badge: "bg-slate-200 text-slate-800", dot: "bg-slate-400" };
        const teacherNames = staff.map(st => st.name);
        const uniqueTeachers = [...new Set([...teacherNames, ...(rules.courses || []).map(c => c.teacher)])].filter(Boolean);
        const index = uniqueTeachers.indexOf(tName);
        if (index === -1) return teacherColorPalette[0];
        return teacherColorPalette[index % teacherColorPalette.length];
      };

      const handleStartLesson = (id) => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        const target = students.find(s => s.id === id);
        if (!target) return;

        const nextCount = Math.min(4, (target.lessonCount || 0) + 1);
        const logs = target.logs || {};
        
        const existingLogKey = Object.keys(logs).find(k => logs[k].date === dateStr);
        let updatedLogs = { ...logs };

        if (existingLogKey) {
          updatedLogs[existingLogKey] = { ...updatedLogs[existingLogKey], startTime: timeStr };
        } else {
          const newKey = String(Date.now());
          updatedLogs[newKey] = { date: dateStr, startTime: timeStr, endTime: '-', lessonNote: '', note: '' };
        }

        const updateData = { lessonCount: nextCount, lastAttendanceDate: dateStr, logs: updatedLogs };
        if (db) db.ref(`students/${id}`).update(updateData);
      };

      const handleEndLesson = (id) => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        const target = students.find(s => s.id === id);
        if (!target) return;

        const logs = target.logs || {};
        const existingLogKey = Object.keys(logs).find(k => logs[k].date === dateStr);
        let updatedLogs = { ...logs };

        if (existingLogKey) {
          updatedLogs[existingLogKey] = { ...updatedLogs[existingLogKey], endTime: timeStr };
        } else {
          const newKey = String(Date.now());
          updatedLogs[newKey] = { date: dateStr, startTime: '-', endTime: timeStr, lessonNote: '', note: '' };
        }

        if (db) db.ref(`students/${id}`).update({ logs: updatedLogs });
      };

      const updateLessonCount = (id, delta) => {
        const target = students.find(s => s.id === id);
        if (!target) return;
        const nextCount = Math.min(4, Math.max(0, (target.lessonCount || 0) + delta));
        if (db) db.ref(`students/${id}`).update({ lessonCount: nextCount });
      };

      const resetLessonCount = (id) => {
        if (db) db.ref(`students/${id}`).update({ lessonCount: 0, logs: {} });
      };

      const handleLogFieldChange = (studentId, logKey, field, value) => {
        const target = students.find(s => s.id === studentId);
        if (!target || !target.logs || !target.logs[logKey]) return;

        const updatedLogs = {
          ...target.logs,
          [logKey]: { ...target.logs[logKey], [field]: value }
        };

        if (db) db.ref(`students/${studentId}`).update({ logs: updatedLogs });
      };

      const saveStudentEdit = (id) => {
        if (db) db.ref(`students/${id}`).update(editStudentData);
        setEditingStudentId(null);
      };

      const saveStaffEdit = (id) => {
        if (db) db.ref(`staff/${id}`).update(editStaffData);
        setEditingStaffId(null);
      };

      const saveLedgerEdit = (id) => {
        const cleaned = {
          date: editLedgerData.date,
          deposit: editLedgerData.deposit ? Number(String(editLedgerData.deposit).replace(/[^0-9]/g, '')) : 0,
          withdrawal: editLedgerData.withdrawal ? Number(String(editLedgerData.withdrawal).replace(/[^0-9]/g, '')) : 0,
          method: editLedgerData.method,
          note: editLedgerData.note
        };
        if (db) db.ref(`ledger/${id}`).update(cleaned);
        setEditingLedgerId(null);
      };

      const addStudent = (e) => {
        e.preventDefault();
        if (!newStudent.name) return;
        
        let assignedTeacher = isTeacherMode ? urlTeacher : newStudent.teacher;
        let assignedCourse = newStudent.course;

        if (!assignedTeacher && assignedCourse) {
          const foundCourse = (rules.courses || []).find(c => c.name === assignedCourse);
          if (foundCourse && foundCourse.teacher) assignedTeacher = foundCourse.teacher;
        }
        if (!assignedTeacher) assignedTeacher = "담당 미정";

        const id = String(Date.now());
        const newObj = {
          id,
          name: newStudent.name,
          phone: newStudent.phone,
          course: assignedCourse || '일반 레슨',
          teacher: assignedTeacher,
          dayOfWeek: newStudent.dayOfWeek || "월요일",
          timeSlot: newStudent.timeSlot || "14:00",
          lessonCount: 0,
          lastAttendanceDate: '-',
          logs: {}
        };
        if (db) db.ref(`students/${id}`).set(newObj);
        setNewStudent({ name: "", phone: "", course: "", teacher: isTeacherMode ? urlTeacher : "", dayOfWeek: "월요일", timeSlot: "14:00" });
      };

      const deleteStudent = (id) => {
        if (db) db.ref(`students/${id}`).remove();
      };

      const addCourse = (e) => {
        e.preventDefault();
        if (!newCourse.name || !newCourse.fee) return;
        const updatedCourses = [...(rules.courses || []), { ...newCourse, id: Date.now(), fee: Number(newCourse.fee) }];
        const newRules = { ...rules, courses: updatedCourses };
        if (db) db.ref('rules').set(newRules);
        setNewCourse({ teacher: "", name: "", fee: "", hours: "4회 / 회당 50분" });
      };

      const deleteCourse = (id) => {
        const updatedCourses = (rules.courses || []).filter(c => c.id !== id);
        const newRules = { ...rules, courses: updatedCourses };
        if (db) db.ref('rules').set(newRules);
      };

      const addLedger = (e) => {
        e.preventDefault();
        const depNum = newLedger.deposit ? Number(String(newLedger.deposit).replace(/[^0-9]/g, '')) : 0;
        const witNum = newLedger.withdrawal ? Number(String(newLedger.withdrawal).replace(/[^0-9]/g, '')) : 0;
        if (depNum === 0 && witNum === 0) {
          alert("입금금액 또는 출금금액 중 하나를 입력해주세요.");
          return;
        }
        const id = String(Date.now());
        const newItem = { 
          id, 
          date: newLedger.date, 
          deposit: depNum, 
          withdrawal: witNum, 
          method: newLedger.method, 
          note: newLedger.note 
        };
        if (db) db.ref(`ledger/${id}`).set(newItem);
        setNewLedger({ date: new Date().toISOString().split('T')[0], deposit: "", withdrawal: "", method: "카드", note: "" });
      };

      const deleteLedger = (id) => {
        if (db) db.ref(`ledger/${id}`).remove();
      };

      const handleSelectAllLedger = (e) => {
        if (e.target.checked) {
          setSelectedLedgerIds(ledger.map(item => item.id));
        } else {
          setSelectedLedgerIds([]);
        }
      };

      const handleSelectLedgerItem = (id) => {
        if (selectedLedgerIds.includes(id)) {
          setSelectedLedgerIds(selectedLedgerIds.filter(i => i !== id));
        } else {
          setSelectedLedgerIds([...selectedLedgerIds, id]);
        }
      };

      const handleDeleteSelectedLedger = () => {
        if (selectedLedgerIds.length === 0) {
          alert("선택된 항목이 없습니다.");
          return;
        }
        if (confirm(`선택한 ${selectedLedgerIds.length}건의 장부 내역을 삭제하시겠습니까?`)) {
          if (db) {
            selectedLedgerIds.forEach(id => {
              db.ref(`ledger/${id}`).remove();
            });
          }
          setSelectedLedgerIds([]);
        }
      };

      const handleDeleteAllLedger = () => {
        if (ledger.length === 0) {
          alert("삭제할 장부 내역이 없습니다.");
          return;
        }
        if (confirm("🚨 경고: 장부에 등록된 모든 입출금 내역이 영구적으로 삭제됩니다. 정말 전체 삭제하시겠습니까?")) {
          if (db) {
            db.ref('ledger').remove();
          }
          setSelectedLedgerIds([]);
          alert("전체 장부 내역이 초기화되었습니다.");
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        if (file.name.endsWith('.xlsx') || file.name.endsWith('.csv')) {
          reader.readAsArrayBuffer(file);
        } else {
          reader.readAsText(file, 'euc-kr');
        }

        reader.onload = (evt) => {
          try {
            const fileData = evt.target.result;
            let rowsData = [];

            if (file.name.endsWith('.xlsx') || file.name.endsWith('.csv')) {
              const workbook = XLSX.read(fileData, { type: 'array', cellDates: true });
              const sheetName = workbook.SheetNames[0];
              rowsData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });

              let importedCount = 0;
              rowsData.forEach((row, idx) => {
                if (idx === 0 || !row || row.length < 4) return;

                let dateRaw = String(row[1] || '').trim();
                let dateMatch = dateRaw.match(/\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}/);
                let date = dateMatch ? dateMatch[0].replace(/\./g, "-").replace(/\//g, "-") : new Date().toISOString().split('T')[0];

                const amount = Number(String(row[3] || '').replace(/[^0-9]/g, '')) || 0;
                if (amount === 0) return;

                const cardCompany = String(row[2] || '카드').trim();
                const content = String(row[4] || '').trim();
                const memo = String(row[5] || '').trim();

                const id = String(Date.now()) + "_" + idx + "_" + Math.floor(Math.random() * 1000);
                const item = {
                  id,
                  date,
                  deposit: amount,
                  withdrawal: 0,
                  method: "카드",
                  note: `[${cardCompany}] ${content} ${memo}`.trim()
                };

                if (db) {
                  db.ref(`ledger/${id}`).set(item);
                }
                importedCount++;
              });

              alert(`성공! 카드 정제 파일에서 총 ${importedCount}건의 내역이 회계 장부에 등록되었습니다.`);

            } else {
              const parser = new DOMParser();
              const doc = parser.parseFromString(fileData, 'text/html');
              const rows = doc.querySelectorAll('tr');

              if (!rows || rows.length === 0) {
                alert("엑셀 파일에서 데이터를 읽지 못했습니다.");
                return;
              }

              let importedCount = 0;
              const CARD_KEYWORDS = ["NH168", "KB110", "롯데", "삼성카드", "SHC", "현1631", "우6011", "가맹점", "카드", "하나"];

              rows.forEach((row, idx) => {
                const cols = Array.from(row.querySelectorAll('td, th')).map(td => td.textContent.trim());
                if (cols.length < 8 || !/^[0-9]+$/.test(cols[0])) return;

                const dateRaw = cols[1] || '';
                const dateMatch = dateRaw.match(/\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}/);
                if (!dateMatch) return;
                const date = dateMatch[0].replace(/\./g, "-").replace(/\//g, "-");

                const withdrawal = Number((cols[2] || '').replace(/[^0-9]/g, '')) || 0;
                const deposit = Number((cols[3] || '').replace(/[^0-9]/g, '')) || 0;

                const amount = deposit > 0 ? deposit : withdrawal;
                if (amount === 0) return;

                const content = cols[5] || '';
                const memo = cols[6] || '';
                const branch = cols[7] || '';
                const fullText = `${content} ${memo} ${branch}`;

                const isCardTx = CARD_KEYWORDS.some(keyword => fullText.includes(keyword));
                if (!isCardTx) return;

                const id = String(Date.now()) + "_" + idx + "_" + Math.floor(Math.random() * 1000);
                const noteText = [content, memo].filter(Boolean).join(" / ") || "카드매입거래";

                const item = {
                  id,
                  date,
                  deposit: deposit > 0 ? deposit : 0,
                  withdrawal: withdrawal > 0 ? withdrawal : 0,
                  method: "카드",
                  note: `[카드매입] ${noteText}`
                };

                if (db) {
                  db.ref(`ledger/${id}`).set(item);
                }
                importedCount++;
              });

              alert(`성공! 원본 파일에서 카드 매입 내역 총 ${importedCount}건이 등록되었습니다.`);
            }

            e.target.value = "";
          } catch (err) {
            console.error(err);
            alert("처리 중 오류 발생: " + err.message);
          }
        };
      };

      const addStaff = (e) => {
        e.preventDefault();
        if (!newStaff.name) return;
        const id = String(Date.now());
        const newItem = { id, ...newStaff };
        if (db) db.ref(`staff/${id}`).set(newItem);

        const defaultCourseName = `${newItem.subject} 전문반 (주1회/4회)`;
        const courseExists = (rules.courses || []).some(c => c.teacher === newItem.name && c.name === defaultCourseName);
        if (!courseExists) {
          const updatedCourses = [...(rules.courses || []), { id: Date.now(), teacher: newItem.name, name: defaultCourseName, fee: 200000, hours: "4회 / 회당 50분" }];
          if (db) db.ref('rules').update({ courses: updatedCourses });
        }

        setNewStaff({ name: "", role: "강사", subject: "드럼", hireDate: new Date().toISOString().split('T')[0], checkCrime: true, checkSex: true });
        alert(`[${newStaff.name} 강사님]이 등록되었으며, 과목 및 개인 링크가 자동 연동되었습니다!`);
      };

      const deleteStaff = (id) => {
        if (db) db.ref(`staff/${id}`).remove();
      };

      const teacherList = ['전체', ...new Set([...staff.map(st => st.name), ...(rules.courses || []).map(c => c.teacher)].filter(Boolean))];
      const filteredStudents = isTeacherMode 
        ? students.filter(s => s.teacher === urlTeacher)
        : (selectedTeacher === '전체' ? students : students.filter(s => s.teacher === selectedTeacher));

      const getTeacherLink = (tName) => {
        const baseUrl = window.location.href.split('?')[0];
        return `${baseUrl}?teacher=${encodeURIComponent(tName)}`;
      };

      // 월별 집계 데이터 계산 함수
      const getMonthlySummary = () => {
        const summary = {};
        ledger.forEach(item => {
          if (!item.date) return;
          const monthKey = item.date.substring(0, 7); // "YYYY-MM"
          if (!summary[monthKey]) {
            summary[monthKey] = { month: monthKey, deposit: 0, withdrawal: 0, count: 0 };
          }
          summary[monthKey].deposit += Number(item.deposit || 0);
          summary[monthKey].withdrawal += Number(item.withdrawal || 0);
          summary[monthKey].count += 1;
        });
        // 최신 월 순서로 정렬
        return Object.values(summary).sort((a, b) => b.month.localeCompare(a.month));
      };

      const monthlySummary = getMonthlySummary();

      const daysOfWeek = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
      const timeSlots = ["10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"];

      return (
        <div className="max-w-6xl mx-auto space-y-3 md:space-y-6">
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 md:p-5 rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 gap-3">
            <div>
              <span className="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                {isTeacherMode ? `👨‍🏫 ${urlTeacher} 선생님 전용 페이지` : "👑 원장님 전체 관리 모드"}
              </span>
              <h1 className="text-lg md:text-2xl font-bold text-slate-900 mt-1">{rules.academyName} <span className="text-xs md:text-sm font-normal text-slate-500">({rules.regNum})</span></h1>
            </div>
            {!isTeacherMode && (
              <div className="flex gap-2 w-full md:w-auto">
                <label className="flex-1 md:flex-none text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-2.5 rounded-xl shadow-sm text-xs cursor-pointer transition-all">
                  📊 외부 엑셀 연동
                  <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                </label>
                <button onClick={() => window.print()} className="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium px-3.5 py-2.5 rounded-xl shadow-sm text-xs transition-all">
                  🖨️ 인쇄
                </button>
              </div>
            )}
          </header>

          <div className="flex overflow-x-auto gap-1.5 pb-2 scrollbar-none">
            <button
              onClick={() => setActiveTab('timetable')}
              className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'timetable' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}
            >
              📅 {isTeacherMode ? '나의 시간표' : '전체 시간표'}
            </button>
            <button
              onClick={() => setActiveTab('students')}
              className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'students' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}
            >
              ④ 수강생 대장
            </button>
            {!isTeacherMode && (
              <>
                <button onClick={() => setActiveTab('rules')} className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'rules' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}>① 과목 (강사명부 연동)</button>
                <button onClick={() => setActiveTab('ledger')} className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'ledger' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}>② 회계 장부(입출금)</button>
                <button onClick={() => setActiveTab('receipt')} className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'receipt' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}>③ 영수증</button>
                <button onClick={() => setActiveTab('staff')} className={`whitespace-nowrap px-3.5 py-2.5 md:p-4 rounded-xl md:rounded-2xl font-semibold text-xs md:text-sm transition-all shrink-0 ${activeTab === 'staff' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100'}`}>⑤ 강사명부</button>
              </>
            )}
          </div>

          {activeTab === 'timetable' && (
            <div className="bg-white p-3 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 space-y-4">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                <div>
                  <h3 className="font-bold text-slate-900 text-base md:text-lg">
                    {isTeacherMode ? `👨‍🏫 ${urlTeacher} 선생님 주간 시간표` : "📅 전체 강사 주간 시간표"}
                  </h3>
                  <p className="text-xs text-slate-500">학생 이름을 누르면 수강생 대장으로 바로 이동합니다.</p>
                </div>
                {!isTeacherMode && (
                  <select 
                    value={selectedTeacher} 
                    onChange={e => setSelectedTeacher(e.target.value)} 
                    className="p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold w-full md:w-auto"
                  >
                    {teacherList.map(t => <option key={t} value={t}>{t === '전체' ? '전체 강사 보기' : `${t} 선생님`}</option>)}
                  </select>
                )}
              </div>

              <div className="overflow-x-auto pb-2">
                <div className="min-w-[950px] grid grid-cols-7 gap-2">
                  {daysOfWeek.map(day => {
                    const dayStudents = filteredStudents.filter(s => (s.dayOfWeek || '월요일') === day);
                    return (
                      <div key={day} className="bg-slate-50/70 border border-slate-200/80 rounded-2xl p-2.5 space-y-2.5">
                        <div className="text-center font-bold text-slate-800 bg-white py-1.5 rounded-xl shadow-2xs border border-slate-100 text-xs">
                          {day} <span className="text-blue-600 font-semibold">({dayStudents.length})</span>
                        </div>
                        <div className="space-y-2 min-h-[280px]">
                          {dayStudents.length === 0 ? (
                            <div className="text-center text-slate-400 text-[11px] py-10">일정 없음</div>
                          ) : (
                            dayStudents
                              .sort((a, b) => (a.timeSlot || '14:00').localeCompare(b.timeSlot || '14:00'))
                              .map(s => {
                                const isDone = (s.lessonCount || 0) >= 4;
                                const tColor = getTeacherColor(s.teacher);
                                return (
                                  <div key={s.id} className={`p-2.5 rounded-xl border shadow-2xs space-y-1 ${isDone ? 'bg-rose-50 border-rose-200 text-rose-900' : `${tColor.bg} ${tColor.border}`}`}>
                                    <div className="flex justify-between items-center text-[11px]">
                                      <span className="font-bold bg-white/80 px-1 py-0.5 rounded shadow-2xs">{s.timeSlot || '시간미정'}</span>
                                      <span className="font-bold text-slate-500">{s.lessonCount || 0}/4회</span>
                                    </div>
                                    <button 
                                      onClick={() => {
                                        setActiveTab('students');
                                        setExpandedStudentId(s.id);
                                      }}
                                      className="font-bold text-xs truncate hover:underline text-left block w-full py-0.5 text-slate-900"
                                    >
                                      {s.name} ➡️
                                    </button>
                                    <div className="text-[10px] text-slate-600 truncate">{s.course}</div>
                                    {!isTeacherMode && (
                                      <div className="flex items-center gap-1 mt-1 pt-1 border-t border-slate-200/40">
                                        <span className={`w-2 h-2 rounded-full ${tColor.dot}`}></span>
                                        <span className={`text-[10px] font-bold truncate ${tColor.text}`}>{s.teacher}</span>
                                      </div>
                                    )}
                                  </div>
                                );
                              })
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'students' && (
            <div className="space-y-3 md:space-y-6">
              {!isTeacherMode && (
                <div className="bg-white p-3.5 md:p-4 rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 space-y-2">
                  <span className="text-xs font-bold text-slate-500 block">🔗 등록된 강사별 전용 개인 링크 바로가기/복사:</span>
                  <div className="flex flex-wrap gap-1.5">
                    {staff.map(st => {
                      const tColor = getTeacherColor(st.name);
                      return (
                        <button
                          key={st.id}
                          onClick={() => {
                            const link = getTeacherLink(st.name);
                            navigator.clipboard.writeText(link);
                            alert(`[${st.name} 선생님] 개인 링크 복사 완료!\n\n${link}`);
                          }}
                          className={`${tColor.badge} hover:opacity-90 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5`}
                        >
                          <span className={`w-2 h-2 rounded-full ${tColor.dot}`}></span>
                          📋 {st.name} 선생님 링크 복사
                        </button>
                      );
                    })}
                    {staff.length === 0 && <span className="text-xs text-slate-400">등록된 강사가 없습니다. ⑤ 강사명부 탭에서 강사를 등록해주세요.</span>}
                  </div>
                </div>
              )}

              <form onSubmit={addStudent} className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-6 gap-2.5 items-end">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">이름</label>
                  <input type="text" placeholder="수강생 이름" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">연락처</label>
                  <input type="text" placeholder="010-0000-0000" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">과목 (강사 연동)</label>
                  <select value={newStudent.course} onChange={e => setNewStudent({...newStudent, course: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm">
                    <option value="">과목 선택 (자동연동)</option>
                    {(rules.courses || []).map(c => <option key={c.id} value={c.name}>[{c.teacher || '공통'}] {c.name}</option>)}
                  </select>
                </div>
                {!isTeacherMode && (
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">담당 강사</label>
                    <select value={newStudent.teacher} onChange={e => setNewStudent({...newStudent, teacher: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm">
                      <option value="">강사명부에서 선택</option>
                      {staff.map(st => <option key={st.id} value={st.name}>{st.name} 선생님 ({st.subject})</option>)}
                    </select>
                  </div>
                )}
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">요일</label>
                  <select value={newStudent.dayOfWeek} onChange={e => setNewStudent({...newStudent, dayOfWeek: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm">
                    {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">시간</label>
                  <select value={newStudent.timeSlot} onChange={e => setNewStudent({...newStudent, timeSlot: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs md:text-sm">
                    {timeSlots.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-xs md:text-sm hover:bg-blue-700 md:col-span-6">
                  {isTeacherMode ? `[${urlTeacher} 선생님] 수강생 등록 및 시간표 연동` : "수강생 등록"}
                </button>
              </form>

              <div className="bg-white p-3.5 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 space-y-3">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-1">
                  <h3 className="font-bold text-slate-900 text-sm md:text-base">
                    {isTeacherMode ? `👨‍🏫 ${urlTeacher} 선생님 담당 수강생 대장` : "원생 관리 대장"} ({filteredStudents.length}명)
                  </h3>
                  <span className="text-[11px] text-blue-600">💡 이름 클릭 시 레슨 날짜 목록 표시, 날짜 클릭 시 진도·상세정보 확인</span>
                </div>

                <div className="space-y-2.5">
                  {filteredStudents.map(s => {
                    const isDone = (s.lessonCount || 0) >= 4;
                    const isExpanded = expandedStudentId === s.id;
                    const isEditing = editingStudentId === s.id;
                    const logs = s.logs || {};
                    const logKeys = Object.keys(logs).sort((a, b) => logs[b].date.localeCompare(logs[a].date));
                    const tColor = getTeacherColor(s.teacher);

                    return (
                      <div key={s.id} className={`p-3.5 rounded-2xl border transition-all ${isDone ? "bg-rose-50/70 border-rose-200" : `${tColor.bg} ${tColor.border}`}`}>
                        <div className="flex flex-col gap-2.5">
                          <div className="flex justify-between items-start gap-2">
                            <div className="flex items-center gap-2.5">
                              <div className="w-8 h-8 rounded-full bg-white shadow-2xs text-slate-800 flex items-center justify-center font-bold text-xs shrink-0 border border-slate-200">
                                {s.name ? s.name[0] : '학'}
                              </div>
                              <div>
                                {isEditing ? (
                                  <div className="flex flex-wrap gap-1.5 items-center">
                                    <input 
                                      type="text" 
                                      value={editStudentData.name !== undefined ? editStudentData.name : s.name} 
                                      onChange={e => setEditStudentData({...editStudentData, name: e.target.value})} 
                                      className="p-1 bg-white border rounded text-xs w-20 font-bold"
                                      placeholder="이름"
                                    />
                                    <input 
                                      type="text" 
                                      value={editStudentData.phone !== undefined ? editStudentData.phone : s.phone} 
                                      onChange={e => setEditStudentData({...editStudentData, phone: e.target.value})} 
                                      className="p-1 bg-white border rounded text-xs w-28"
                                      placeholder="연락처"
                                    />
                                    <select 
                                      value={editStudentData.dayOfWeek !== undefined ? editStudentData.dayOfWeek : s.dayOfWeek} 
                                      onChange={e => setEditStudentData({...editStudentData, dayOfWeek: e.target.value})}
                                      className="p-1 bg-white border rounded text-xs"
                                    >
                                      {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                                    </select>
                                    <select 
                                      value={editStudentData.timeSlot !== undefined ? editStudentData.timeSlot : s.timeSlot} 
                                      onChange={e => setEditStudentData({...editStudentData, timeSlot: e.target.value})}
                                      className="p-1 bg-white border rounded text-xs"
                                    >
                                      {timeSlots.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                    <button onClick={() => saveStudentEdit(s.id)} className="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs font-bold">저장</button>
                                    <button onClick={() => setEditingStudentId(null)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs">취소</button>
                                  </div>
                                ) : (
                                  <>
                                    <div className="flex items-center gap-1.5 flex-wrap">
                                      <button 
                                        onClick={() => setExpandedStudentId(isExpanded ? null : s.id)}
                                        className="font-bold text-slate-900 text-sm hover:text-blue-600 text-left flex items-center gap-1"
                                      >
                                        {s.name} <span className="text-[10px] text-blue-500">{isExpanded ? '▲ 닫기' : '▼ 레슨날짜보기'}</span>
                                      </button>
                                      {!isTeacherMode && (
                                        <span className={`text-[10px] ${tColor.badge} px-2 py-0.5 rounded-full font-bold flex items-center gap-1`}>
                                          <span className={`w-1.5 h-1.5 rounded-full ${tColor.dot}`}></span>
                                          {s.teacher}
                                        </span>
                                      )}
                                      <span className="text-[10px] bg-white/80 border border-slate-200 text-indigo-700 px-1.5 py-0.5 rounded font-bold">📅 {s.dayOfWeek || '월요일'} {s.timeSlot || '14:00'}</span>
                                      
                                      <button 
                                        onClick={() => { setEditingStudentId(s.id); setEditStudentData({name: s.name, phone: s.phone, dayOfWeek: s.dayOfWeek || '월요일', timeSlot: s.timeSlot || '14:00'}); }}
                                        className="text-[10px] bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-semibold"
                                      >
                                        ✏️ 수정
                                      </button>
                                    </div>
                                    <p className="text-[11px] text-slate-600 mt-0.5">{s.course} | 📞 {s.phone}</p>
                                  </>
                                )}
                              </div>
                            </div>
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-200/60">
                            <div className="flex items-center gap-1.5">
                              <button 
                                onClick={() => handleStartLesson(s.id)}
                                className="text-[11px] bg-blue-600 text-white px-2.5 py-1 rounded-lg font-bold"
                              >
                                ▶ 시작
                              </button>
                              <button 
                                onClick={() => handleEndLesson(s.id)}
                                className="text-[11px] bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold"
                              >
                                ⏹ 종료
                              </button>
                            </div>

                            <div className="flex items-center gap-2">
                              <div className="flex items-center gap-1 bg-white p-1 rounded-lg shadow-2xs border border-slate-200">
                                <button onClick={() => updateLessonCount(s.id, -1)} className="w-6 h-6 bg-slate-100 rounded font-bold text-slate-600 text-xs">-</button>
                                <span className="font-bold text-xs w-12 text-center">{s.lessonCount || 0} / 4</span>
                                <button onClick={() => updateLessonCount(s.id, 1)} className="w-6 h-6 bg-slate-100 rounded font-bold text-slate-600 text-xs">+</button>
                              </div>

                              {isDone ? (
                                <span className="bg-rose-500 text-white text-[10px] px-2 py-1 rounded-lg font-bold animate-pulse">
                                  🚨 4회 완료
                                </span>
                              ) : (
                                <span className="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-1 rounded-lg font-bold">
                                  {4 - (s.lessonCount || 0)}회 남음
                                </span>
                              )}

                              {!isTeacherMode && isDone && (
                                <button onClick={() => resetLessonCount(s.id)} className="text-[10px] bg-slate-800 text-white px-2 py-1 rounded-lg font-medium">리셋</button>
                              )}
                              <button onClick={() => deleteStudent(s.id)} className="text-slate-400 hover:text-rose-500 text-[11px]">삭제</button>
                            </div>
                          </div>
                        </div>

                        {isExpanded && (
                          <div className="mt-3 pt-3 border-t border-slate-200/80 bg-white p-3 rounded-xl shadow-inner space-y-2 text-xs">
                            <div className="font-bold text-slate-700 mb-1 flex items-center justify-between">
                              <span>📅 레슨 받은 날짜 목록</span>
                              <span className="text-[11px] text-slate-400">날짜를 누르면 진도·시간이 열립니다</span>
                            </div>

                            {logKeys.length === 0 ? (
                              <div className="text-center text-slate-400 py-4 text-[11px]">아직 기록된 레슨 날짜가 없습니다.</div>
                            ) : (
                              <div className="space-y-1.5">
                                {logKeys.map(logKey => {
                                  const log = logs[logKey];
                                  const isLogExpanded = expandedLogKey === logKey;

                                  return (
                                    <div key={logKey} className="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                                      <button 
                                        onClick={() => setExpandedLogKey(isLogExpanded ? null : logKey)}
                                        className="w-full px-3 py-2 flex justify-between items-center text-left hover:bg-slate-100 transition-colors font-semibold text-slate-800"
                                      >
                                        <div className="flex items-center gap-2">
                                          <span className="text-blue-600 font-bold">📅 {log.date}</span>
                                          <span className="text-[10px] text-slate-500 font-normal">({log.startTime || '-'} ~ {log.endTime || '-'})</span>
                                        </div>
                                        <span className="text-slate-400 text-xs">{isLogExpanded ? '▲ 닫기' : '▼ 진도상세'}</span>
                                      </button>

                                      {isLogExpanded && (
                                        <div className="p-3 bg-white border-t border-slate-200 space-y-2.5 text-xs">
                                          <div className="grid grid-cols-2 gap-2 text-[11px]">
                                            <div className="bg-slate-50 p-2 rounded-lg border text-center">
                                              <span className="text-slate-400 block text-[10px]">시작 시간</span>
                                              <span className="font-semibold text-blue-600">{log.startTime || '-'}</span>
                                            </div>
                                            <div className="bg-slate-50 p-2 rounded-lg border text-center">
                                              <span className="text-slate-400 block text-[10px]">종료 시간</span>
                                              <span className="font-semibold text-emerald-600">{log.endTime || '-'}</span>
                                            </div>
                                          </div>

                                          <div className="space-y-2">
                                            <div>
                                              <label className="font-bold text-slate-500 block text-[11px] mb-1">📝 진도 내용:</label>
                                              <input 
                                                type="text" 
                                                placeholder="오늘 진도 내용을 입력하세요..." 
                                                value={log.lessonNote || ''} 
                                                onChange={(e) => handleLogFieldChange(s.id, logKey, 'lessonNote', e.target.value)}
                                                className="w-full p-2 bg-slate-50 rounded-lg border text-xs"
                                              />
                                            </div>
                                            <div>
                                              <label className="font-bold text-slate-500 block text-[11px] mb-1">📌 특이사항:</label>
                                              <input 
                                                type="text" 
                                                placeholder="특이사항을 입력하세요..." 
                                                value={log.note || ''} 
                                                onChange={(e) => handleLogFieldChange(s.id, logKey, 'note', e.target.value)}
                                                className="w-full p-2 bg-slate-50 rounded-lg border text-xs"
                                              />
                                            </div>
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'rules' && !isTeacherMode && (
            <div className="space-y-4">
              <form onSubmit={addCourse} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-2.5 items-end">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">선생님 (강사명부 연동)</label>
                  <select value={newCourse.teacher} onChange={e => setNewCourse({...newCourse, teacher: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs">
                    <option value="">강사 선택</option>
                    {staff.map(st => <option key={st.id} value={st.name}>{st.name} ({st.subject})</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">과목명</label>
                  <input type="text" placeholder="예: 드럼 기초반" value={newCourse.name} onChange={e => setNewCourse({...newCourse, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">4회 레슨비</label>
                  <input type="number" placeholder="원" value={newCourse.fee} onChange={e => setNewCourse({...newCourse, fee: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">시간</label>
                  <input type="text" value={newCourse.hours} onChange={e => setNewCourse({...newCourse, hours: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-xs" />
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-xs hover:bg-blue-700">과목 추가</button>
              </form>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                <h2 className="text-base font-bold mb-3">등록 과목 목록 (강사명부 연동)</h2>
                <table className="w-full text-left text-xs min-w-[400px]">
                  <thead className="bg-slate-50 text-slate-500">
                    <tr>
                      <th className="p-3">선생님</th>
                      <th className="p-3">과목명</th>
                      <th className="p-3">레슨시간</th>
                      <th className="p-3 text-right">4회 수강료</th>
                      <th className="p-3 text-center">삭제</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {(rules.courses || []).map(c => (
                      <tr key={c.id}>
                        <td className="p-3 font-bold">{c.teacher || '공통'}</td>
                        <td className="p-3 font-semibold">{c.name}</td>
                        <td className="p-3 text-slate-600">{c.hours}</td>
                        <td className="p-3 text-right font-bold text-blue-600">{(c.fee || 0).toLocaleString()}원</td>
                        <td className="p-3 text-center"><button onClick={() => deleteCourse(c.id)} className="text-slate-400 hover:text-rose-500">삭제</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab === 'ledger' && !isTeacherMode && (
            <div className="space-y-4">
              {/* 월별 토탈 집계 요약 카드 영역 */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <h3 className="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                  📊 월별 토탈 금액 집계 (수입/지출/순수익)
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5">
                  {monthlySummary.map(m => {
                    const netProfit = m.deposit - m.withdrawal;
                    return (
                      <div key={m.month} className="bg-slate-50 border border-slate-200/80 p-3 rounded-xl space-y-1.5 text-xs">
                        <div className="flex justify-between items-center font-bold text-slate-800 border-b pb-1">
                          <span>📅 {m.month}</span>
                          <span className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded">{m.count}건</span>
                        </div>
                        <div className="space-y-0.5 text-[11px]">
                          <div className="flex justify-between">
                            <span className="text-slate-500">수입:</span>
                            <span className="font-bold text-emerald-600">+{m.deposit.toLocaleString()}원</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-500">지출:</span>
                            <span className="font-bold text-rose-600">-{m.withdrawal.toLocaleString()}원</span>
                          </div>
                          <div className="flex justify-between pt-1 border-t border-slate-200 font-bold">
                            <span className="text-slate-700">순수익:</span>
                            <span className={netProfit >= 0 ? "text-blue-600" : "text-rose-600"}>{netProfit.toLocaleString()}원</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  {monthlySummary.length === 0 && (
                    <div className="col-span-full text-center text-slate-400 py-6 text-xs">
                      등록된 장부 내역이 없습니다.
                    </div>
                  )}
                </div>
              </div>

              <form onSubmit={addLedger} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-6 gap-2.5 items-end text-xs">
                <div>
                  <label className="text-slate-500 mb-1 block">일자</label>
                  <input type="date" value={newLedger.date} onChange={e => setNewLedger({...newLedger, date: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl" />
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block font-bold text-emerald-600">💰 입금금액 (수입)</label>
                  <input type="number" placeholder="0" value={newLedger.deposit} onChange={e => setNewLedger({...newLedger, deposit: e.target.value})} className="w-full p-2.5 bg-emerald-50/50 border border-emerald-200 rounded-xl font-bold text-emerald-700" />
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block font-bold text-rose-600">💸 출금금액 (지출)</label>
                  <input type="number" placeholder="0" value={newLedger.withdrawal} onChange={e => setNewLedger({...newLedger, withdrawal: e.target.value})} className="w-full p-2.5 bg-rose-50/50 border border-rose-200 rounded-xl font-bold text-rose-700" />
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block">거래수단</label>
                  <select value={newLedger.method} onChange={e => setNewLedger({...newLedger, method: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl">
                    <option>카드</option>
                    <option>계좌이체</option>
                    <option>현금</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block">적요 및 메모</label>
                  <input type="text" placeholder="예: 레슨비 수납" value={newLedger.note} onChange={e => setNewLedger({...newLedger, note: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl" />
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl hover:bg-blue-700">장부 등록</button>
              </form>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                  <h3 className="font-bold text-slate-900 text-sm">회계 장부 내역 ({ledger.length}건 - 날짜 자동 정렬됨)</h3>
                  <div className="flex gap-2">
                    <button 
                      onClick={handleDeleteSelectedLedger}
                      className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                    >
                      🗑️ 선택 삭제 ({selectedLedgerIds.length}건)
                    </button>
                    <button 
                      onClick={handleDeleteAllLedger}
                      className="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                    >
                      ⚠️ 전체 장부 초기화 (전체 삭제)
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs min-w-[750px]">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="p-3 w-10 text-center">
                          <input 
                            type="checkbox" 
                            onChange={handleSelectAllLedger}
                            checked={ledger.length > 0 && selectedLedgerIds.length === ledger.length}
                          />
                        </th>
                        <th className="p-3">일자</th>
                        <th className="p-3 text-right text-emerald-600">입금금액 (+)</th>
                        <th className="p-3 text-right text-rose-600">출금금액 (-)</th>
                        <th className="p-3">수단</th>
                        <th className="p-3">적요</th>
                        <th className="p-3 text-center">수정 / 삭제</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {ledger.map(item => {
                        const isEditing = editingLedgerId === item.id;
                        const isChecked = selectedLedgerIds.includes(item.id);
                        return (
                          <tr key={item.id} className={isChecked ? "bg-blue-50/40" : ""}>
                            <td className="p-3 text-center">
                              <input 
                                type="checkbox" 
                                checked={isChecked} 
                                onChange={() => handleSelectLedgerItem(item.id)}
                              />
                            </td>
                            <td className="p-3 text-slate-600">
                              {isEditing ? <input type="date" value={editLedgerData.date !== undefined ? editLedgerData.date : item.date} onChange={e => setEditLedgerData({...editLedgerData, date: e.target.value})} className="p-1 border rounded text-xs" /> : item.date}
                            </td>
                            <td className="p-3 text-right font-bold text-emerald-600">
                              {isEditing ? (
                                <input type="number" value={editLedgerData.deposit !== undefined ? editLedgerData.deposit : item.deposit} onChange={e => setEditLedgerData({...editLedgerData, deposit: e.target.value})} className="p-1 border rounded text-xs w-24 text-right" />
                              ) : (
                                item.deposit > 0 ? `+${Number(item.deposit).toLocaleString()}원` : '-'
                              )}
                            </td>
                            <td className="p-3 text-right font-bold text-rose-600">
                              {isEditing ? (
                                <input type="number" value={editLedgerData.withdrawal !== undefined ? editLedgerData.withdrawal : item.withdrawal} onChange={e => setEditLedgerData({...editLedgerData, withdrawal: e.target.value})} className="p-1 border rounded text-xs w-24 text-right" />
                              ) : (
                                item.withdrawal > 0 ? `-${Number(item.withdrawal).toLocaleString()}원` : '-'
                              )}
                            </td>
                            <td className="p-3 text-slate-600">
                              {isEditing ? (
                                <select value={editLedgerData.method !== undefined ? editLedgerData.method : item.method} onChange={e => setEditLedgerData({...editLedgerData, method: e.target.value})} className="p-1 border rounded text-xs">
                                  <option>카드</option>
                                  <option>계좌이체</option>
                                  <option>현금</option>
                                </select>
                              ) : item.method}
                            </td>
                            <td className="p-3 font-medium">
                              {isEditing ? <input type="text" value={editLedgerData.note !== undefined ? editLedgerData.note : item.note} onChange={e => setEditLedgerData({...editLedgerData, note: e.target.value})} className="p-1 border rounded text-xs w-full" /> : item.note}
                            </td>
                            <td className="p-3 text-center space-x-1">
                              {isEditing ? (
                                <>
                                  <button onClick={() => saveLedgerEdit(item.id)} className="bg-emerald-600 text-white px-2 py-1 rounded text-[11px] font-bold">저장</button>
                                  <button onClick={() => setEditingLedgerId(null)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-[11px]">취소</button>
                                </>
                              ) : (
                                <>
                                  <button onClick={() => { setEditingLedgerId(item.id); setEditLedgerData({ date: item.date, deposit: item.deposit || 0, withdrawal: item.withdrawal || 0, method: item.method, note: item.note }); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded text-[11px]">✏️ 수정</button>
                                  <button onClick={() => deleteLedger(item.id)} className="text-slate-400 hover:text-rose-500 text-[11px]">삭제</button>
                                </>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'receipt' && !isTeacherMode && (
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
              <h3 className="font-bold text-slate-900 text-sm">교습비 수납 영수증 원부</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {ledger.filter(l => (l.deposit || 0) > 0).map(item => (
                  <div key={item.id} className="border border-slate-200 p-4 rounded-xl space-y-2 bg-slate-50/30 text-xs">
                    <div className="flex justify-between items-center border-b pb-2">
                      <span className="font-bold text-slate-800">교습비 납부 영수증</span>
                      <span className="text-[11px] text-slate-400">{item.date}</span>
                    </div>
                    <div>
                      <p>수단: <span className="font-semibold">{item.method}</span></p>
                      <p>적요: <span className="font-semibold">{item.note}</span></p>
                    </div>
                    <div className="pt-2 border-t text-right">
                      <span className="text-[11px] text-slate-400 mr-2">입금 금액</span>
                      <span className="text-sm font-bold text-blue-600">+{(item.deposit || 0).toLocaleString()}원</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === 'staff' && !isTeacherMode && (
            <div className="space-y-4">
              <form onSubmit={addStaff} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-2.5 items-end text-xs">
                <div>
                  <label className="text-slate-500 mb-1 block">이름</label>
                  <input type="text" placeholder="선생님 성명" value={newStaff.name} onChange={e => setNewStaff({...newStaff, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl" />
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block">담당과목</label>
                  <input type="text" placeholder="예: 드럼 / 보컬" value={newStaff.subject} onChange={e => setNewStaff({...newStaff, subject: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl" />
                </div>
                <div>
                  <label className="text-slate-500 mb-1 block">채용일</label>
                  <input type="date" value={newStaff.hireDate} onChange={e => setNewStaff({...newStaff, hireDate: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl" />
                </div>
                <div className="flex gap-2 items-center text-slate-600 h-10">
                  <label><input type="checkbox" checked={newStaff.checkCrime} onChange={e => setNewStaff({...newStaff, checkCrime: e.target.checked})} /> 범죄조회</label>
                  <label><input type="checkbox" checked={newStaff.checkSex} onChange={e => setNewStaff({...newStaff, checkSex: e.target.checked})} /> 성범죄조회</label>
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl hover:bg-blue-700">강사 등록 및 과목 자동연동</button>
              </form>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
                <h3 className="font-bold text-slate-900 mb-3 text-sm">강사 관리 명부 및 전용 링크 ({staff.length}명)</h3>
                <table className="w-full text-left text-xs min-w-[700px]">
                  <thead className="bg-slate-50 text-slate-500">
                    <tr>
                      <th className="p-3">성명 (고유컬러)</th>
                      <th className="p-3">직위</th>
                      <th className="p-3">과목</th>
                      <th className="p-3">채용일</th>
                      <th className="p-3 text-center">전력조회</th>
                      <th className="p-3">전용 개인 링크</th>
                      <th className="p-3 text-center">수정/삭제</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {staff.map(st => {
                      const isEditing = editingStaffId === st.id;
                      const teacherLink = getTeacherLink(st.name);
                      const tColor = getTeacherColor(st.name);
                      return (
                        <tr key={st.id}>
                          <td className="p-3 font-bold flex items-center gap-2">
                            <span className={`w-3 h-3 rounded-full ${tColor.dot}`}></span>
                            {isEditing ? <input type="text" value={editStaffData.name !== undefined ? editStaffData.name : st.name} onChange={e => setEditStaffData({...editStaffData, name: e.target.value})} className="p-1 bg-white border rounded text-xs w-20" /> : st.name}
                          </td>
                          <td className="p-3">
                            {isEditing ? <input type="text" value={editStaffData.role !== undefined ? editStaffData.role : st.role} onChange={e => setEditStaffData({...editStaffData, role: e.target.value})} className="p-1 bg-white border rounded text-xs w-16" /> : st.role}
                          </td>
                          <td className="p-3">
                            {isEditing ? <input type="text" value={editStaffData.subject !== undefined ? editStaffData.subject : st.subject} onChange={e => setEditStaffData({...editStaffData, subject: e.target.value})} className="p-1 bg-white border rounded text-xs w-20" /> : st.subject}
                          </td>
                          <td className="p-3">
                            {isEditing ? <input type="date" value={editStaffData.hireDate !== undefined ? editStaffData.hireDate : st.hireDate} onChange={e => setEditStaffData({...editStaffData, hireDate: e.target.value})} className="p-1 bg-white border rounded text-xs" /> : st.hireDate}
                          </td>
                          <td className="p-3 text-center">
                            {isEditing ? (
                              <div className="flex gap-1 justify-center text-[11px]">
                                <label><input type="checkbox" checked={editStaffData.checkCrime !== undefined ? editStaffData.checkCrime : st.checkCrime} onChange={e => setEditStaffData({...editStaffData, checkCrime: e.target.checked})} /> 범죄</label>
                                <label><input type="checkbox" checked={editStaffData.checkSex !== undefined ? editStaffData.checkSex : st.checkSex} onChange={e => setEditStaffData({...editStaffData, checkSex: e.target.checked})} /> 성범죄</label>
                              </div>
                            ) : (
                              st.checkCrime && st.checkSex ? <span className="bg-emerald-50 text-emerald-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">완료</span> : <span className="bg-rose-50 text-rose-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">미완료</span>
                            )}
                          </td>
                          <td className="p-3">
                            <div className="flex items-center gap-1.5">
                              <input type="text" readOnly value={teacherLink} className="p-1 bg-slate-100 border rounded text-[10px] w-36 text-slate-500 truncate" />
                              <button 
                                onClick={() => {
                                  navigator.clipboard.writeText(teacherLink);
                                  alert(`[${st.name} 선생님] 개인 링크가 복사되었습니다!\n\n${teacherLink}`);
                                }}
                                className="bg-blue-50 text-blue-600 hover:bg-blue-100 px-2 py-1 rounded text-[10px] font-bold shrink-0"
                              >
                                복사
                              </button>
                            </div>
                          </td>
                          <td className="p-3 text-center space-x-1">
                            {isEditing ? (
                              <>
                                <button onClick={() => saveStaffEdit(st.id)} className="bg-emerald-600 text-white px-2 py-1 rounded text-[11px] font-bold">저장</button>
                                <button onClick={() => setEditingStaffId(null)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-[11px]">취소</button>
                              </>
                            ) : (
                              <>
                                <button onClick={() => { setEditingStaffId(st.id); setEditStaffData({name: st.name, role: st.role, subject: st.subject, hireDate: st.hireDate, checkCrime: st.checkCrime, checkSex: st.checkSex}); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded text-[11px]">✏️</button>
                                <button onClick={() => deleteStaff(st.id)} className="text-slate-400 hover:text-rose-500 text-[11px]">삭제</button>
                              </>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
