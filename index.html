<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학원 5대 장부 통합 관리 시스템</title>
  <!-- Tailwind CSS & React & Babel & XLSX & Firebase CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-3 md:p-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyArl8_qT9eUfofH9IgK41xtdSPc2DwoB6g",
      authDomain: "simsdrum-33e61.firebaseapp.com",
      databaseURL: "https://simsdrum-33e61-default-rtdb.firebaseio.com",
      projectId: "simsdrum-33e61",
      storageBucket: "simsdrum-33e61.firebasestorage.app",
      messagingSenderId: "797121281913",
      appId: "1:797121281913:web:892c9f4de182799ecfb9a8",
      measurementId: "G-P8VGZ9WZ0K"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch(e) { console.log("Firebase 연결 확인 중...", e); }

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlTeacher = urlParams.get('teacher');
      const isTeacherMode = !!urlTeacher;

      const [activeTab, setActiveTab] = useState(isTeacherMode ? 'timetable' : 'students');
      const [selectedTeacher, setSelectedTeacher] = useState(urlTeacher || '전체');
      const [expandedStudentId, setExpandedStudentId] = useState(null);

      // 인라인 수정 모드 상태 (학생 및 강사)
      const [editingStudentId, setEditingStudentId] = useState(null);
      const [editStudentData, setEditStudentData] = useState({});

      const [editingStaffId, setEditingStaffId] = useState(null);
      const [editStaffData, setEditStaffData] = useState({});

      const [rules, setRules] = useState({
        academyName: "심스드럼실용음악학원",
        regNum: "제 1234호",
        courses: [
          { id: 1, teacher: "김드럼", name: "드럼 기초반 (주1회/4회)", fee: 200000, hours: "4회 / 회당 50분" },
          { id: 2, teacher: "박보컬", name: "보컬 취미반 (주1회/4회)", fee: 220000, hours: "4회 / 회당 50분" }
        ]
      });

      const [students, setStudents] = useState([]);
      const [ledger, setLedger] = useState([]);
      const [staff, setStaff] = useState([]);

      const [newCourse, setNewCourse] = useState({ teacher: "", name: "", fee: "", hours: "4회 / 회당 50분" });
      const [newStudent, setNewStudent] = useState({ name: "", birth: "", phone: "", course: "", dayOfWeek: "월요일", timeSlot: "14:00" });
      const [newLedger, setNewLedger] = useState({ date: new Date().toISOString().split('T')[0], type: "수입", amount: "", method: "카드", note: "" });
      const [newStaff, setNewStaff] = useState({ name: "", role: "강사", subject: "드럼", hireDate: new Date().toISOString().split('T')[0], checkCrime: true, checkSex: true });

      useEffect(() => {
        if (!db) return;

        const stRef = db.ref('students');
        stRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setStudents(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          else setStudents([]);
        });

        const lgRef = db.ref('ledger');
        lgRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setLedger(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          else setLedger([]);
        });

        const sfRef = db.ref('staff');
        sfRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setStaff(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          else setStaff([]);
        });

        const rlRef = db.ref('rules');
        rlRef.on('value', snapshot => {
          const data = snapshot.val();
          if (data) setRules(data);
        });

        return () => { stRef.off(); lgRef.off(); sfRef.off(); rlRef.off(); };
      }, []);

      const handleStartLesson = (id) => {
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        const target = students.find(s => s.id === id);
        if (!target) return;

        const nextCount = Math.min(4, (target.lessonCount || 0) + 1);
        const updateData = { 
          lessonCount: nextCount, 
          lastAttendanceDate: dateStr,
          startTime: timeStr,
          endTime: target.endTime || '-'
        };

        if (db) db.ref(`students/${id}`).update(updateData);
      };

      const handleEndLesson = (id) => {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        if (db) db.ref(`students/${id}`).update({ endTime: timeStr });
      };

      const updateLessonCount = (id, delta) => {
        const target = students.find(s => s.id === id);
        if (!target) return;
        const nextCount = Math.min(4, Math.max(0, (target.lessonCount || 0) + delta));
        if (db) db.ref(`students/${id}`).update({ lessonCount: nextCount });
      };

      const resetLessonCount = (id) => {
        if (db) db.ref(`students/${id}`).update({ lessonCount: 0, startTime: '-', endTime: '-' });
      };

      const handleDetailChange = (id, field, value) => {
        if (db) db.ref(`students/${id}`).update({ [field]: value });
      };

      // 학생 수정 저장
      const saveStudentEdit = (id) => {
        if (db) db.ref(`students/${id}`).update(editStudentData);
        setEditingStudentId(null);
      };

      // 강사 수정 저장
      const saveStaffEdit = (id) => {
        if (db) db.ref(`staff/${id}`).update(editStaffData);
        setEditingStaffId(null);
      };

      const addStudent = (e) => {
        e.preventDefault();
        if (!newStudent.name) return;
        const selectedObj = (rules.courses || []).find(c => c.name === newStudent.course) || rules.courses[0];
        const id = String(Date.now());
        const newObj = {
          id,
          name: newStudent.name,
          birth: newStudent.birth,
          phone: newStudent.phone,
          course: newStudent.course || (selectedObj ? selectedObj.name : ''),
          teacher: selectedObj ? selectedObj.teacher : "담당 미정",
          dayOfWeek: newStudent.dayOfWeek || "월요일",
          timeSlot: newStudent.timeSlot || "14:00",
          lessonCount: 0,
          lastAttendanceDate: '-',
          startTime: '-',
          endTime: '-',
          lessonNote: "",
          note: ""
        };
        if (db) db.ref(`students/${id}`).set(newObj);
        setNewStudent({ name: "", birth: "", phone: "", course: "", dayOfWeek: "월요일", timeSlot: "14:00" });
      };

      const deleteStudent = (id) => {
        if (db) db.ref(`students/${id}`).remove();
      };

      const addCourse = (e) => {
        e.preventDefault();
        if (!newCourse.name || !newCourse.fee) return;
        const updatedCourses = [...(rules.courses || []), { ...newCourse, id: Date.now(), fee: Number(newCourse.fee) }];
        const newRules = { ...rules, courses: updatedCourses };
        if (db) db.ref('rules').set(newRules);
        setNewCourse({ teacher: "", name: "", fee: "", hours: "4회 / 회당 50분" });
      };

      const deleteCourse = (id) => {
        const updatedCourses = (rules.courses || []).filter(c => c.id !== id);
        const newRules = { ...rules, courses: updatedCourses };
        if (db) db.ref('rules').set(newRules);
      };

      const addLedger = (e) => {
        e.preventDefault();
        if (!newLedger.amount) return;
        const id = String(Date.now());
        const newItem = { id, ...newLedger, amount: Number(newLedger.amount) };
        if (db) db.ref(`ledger/${id}`).set(newItem);
        setNewLedger({ date: new Date().toISOString().split('T')[0], type: "수입", amount: "", method: "카드", note: "" });
      };

      const deleteLedger = (id) => {
        if (db) db.ref(`ledger/${id}`).remove();
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
          let importedCount = 0;

          data.forEach((row, idx) => {
            if (idx < 1 || !row || row.length === 0) return;
            const str = row.join(' ');
            const dateMatch = str.match(/\d{4}[-/.]\d{2}[-/.]\d{2}/);
            const date = dateMatch ? dateMatch[0].replace(/\./g, '-') : new Date().toISOString().split('T')[0];
            const amount = row.find(val => typeof val === 'number' && val > 0) || 0;

            if (amount > 0) {
              const isIncome = !str.includes('매입') && !str.includes('지출') && !str.includes('출금');
              const id = String(Date.now() + idx);
              const item = {
                id,
                date,
                type: isIncome ? "수입" : "지출",
                amount,
                method: str.includes('현금') ? "현금" : (str.includes('이체') ? "계좌이체" : "카드"),
                note: `[외부엑셀] ${row[1] || row[0] || '금융/세무 내역'}`
              };
              if (db) db.ref(`ledger/${id}`).set(item);
              importedCount++;
            }
          });

          alert(`외부 엑셀 내역 ${importedCount}건이 클라우드로 자동 저장되었습니다.`);
        };
        reader.readAsBinaryString(file);
      };

      const addStaff = (e) => {
        e.preventDefault();
        if (!newStaff.name) return;
        const id = String(Date.now());
        const newItem = { id, ...newStaff };
        if (db) db.ref(`staff/${id}`).set(newItem);
        setNewStaff({ name: "", role: "강사", subject: "드럼", hireDate: new Date().toISOString().split('T')[0], checkCrime: true, checkSex: true });
      };

      const deleteStaff = (id) => {
        if (db) db.ref(`staff/${id}`).remove();
      };

      const teacherList = ['전체', ...new Set((rules.courses || []).map(c => c.teacher).filter(Boolean))];
      const filteredStudents = isTeacherMode 
        ? students.filter(s => s.teacher === urlTeacher)
        : (selectedTeacher === '전체' ? students : students.filter(s => s.teacher === selectedTeacher));

      const getTeacherLink = (tName) => {
        const baseUrl = window.location.href.split('?')[0];
        return `${baseUrl}?teacher=${encodeURIComponent(tName)}`;
      };

      const daysOfWeek = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
      const timeSlots = ["10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"];

      return (
        <div className="max-w-6xl mx-auto space-y-4 md:space-y-6">
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-3xl shadow-sm border border-slate-100 gap-3">
            <div>
              <span className="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                {isTeacherMode ? `👨‍🏫 ${urlTeacher} 선생님 전용` : "👑 원장님 전체 관리 모드 (실시간 세이브 연동됨)"}
              </span>
              <h1 className="text-xl md:text-2xl font-bold text-slate-900 mt-1">{rules.academyName} <span className="text-xs md:text-sm font-normal text-slate-500">({rules.regNum})</span></h1>
            </div>
            {!isTeacherMode && (
              <div className="flex gap-2 w-full md:w-auto">
                <label className="flex-1 md:flex-none text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-2xl shadow-sm text-xs md:text-sm cursor-pointer transition-all">
                  📊 외부 엑셀(통장/세무) 연동
                  <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                </label>
                <button onClick={() => window.print()} className="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-2xl shadow-sm text-xs md:text-sm transition-all">
                  🖨️ 장부 인쇄
                </button>
              </div>
            )}
          </header>

          <div className="flex md:grid md:grid-cols-6 gap-2 overflow-x-auto pb-1 md:pb-0">
            <button
              onClick={() => setActiveTab('timetable')}
              className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'timetable' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}
            >
              📅 {isTeacherMode ? '나의 시간표' : '전체 시간표'}
            </button>
            <button
              onClick={() => setActiveTab('students')}
              className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'students' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}
            >
              ④ 수강생 대장 (4회)
            </button>
            {!isTeacherMode && (
              <>
                <button onClick={() => setActiveTab('rules')} className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'rules' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}>① 운영원칙 / 과목</button>
                <button onClick={() => setActiveTab('ledger')} className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'ledger' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}>② 수입·지출 장부</button>
                <button onClick={() => setActiveTab('receipt')} className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'receipt' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}>③ 교습비 영수증</button>
                <button onClick={() => setActiveTab('staff')} className={`whitespace-nowrap px-4 py-3 md:p-4 rounded-2xl font-semibold text-xs md:text-sm transition-all ${activeTab === 'staff' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-100'}`}>⑤ 직원 명부</button>
              </>
            )}
          </div>

          {activeTab === 'timetable' && (
            <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                <div>
                  <h3 className="font-bold text-slate-900 text-lg">
                    {isTeacherMode ? `👨‍🏫 ${urlTeacher} 선생님 주간 시간표` : "📅 전체 강사 주간 시간표"}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">요일별·시간대별로 배정된 수강생 스케줄을 한눈에 관리하세요.</p>
                </div>
                {!isTeacherMode && (
                  <div className="flex gap-2">
                    <select 
                      value={selectedTeacher} 
                      onChange={e => setSelectedTeacher(e.target.value)} 
                      className="p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold"
                    >
                      {teacherList.map(t => <option key={t} value={t}>{t} 선생님</option>)}
                    </select>
                  </div>
                )}
              </div>

              <div className="overflow-x-auto">
                <div className="min-w-[800px] grid grid-cols-7 gap-2">
                  {daysOfWeek.map(day => {
                    const dayStudents = filteredStudents.filter(s => (s.dayOfWeek || '월요일') === day);
                    return (
                      <div key={day} className="bg-slate-50/70 border border-slate-200/80 rounded-2xl p-3 space-y-3">
                        <div className="text-center font-bold text-slate-800 bg-white py-2 rounded-xl shadow-xs border border-slate-100 text-sm">
                          {day} <span className="text-xs text-blue-600 font-semibold">({dayStudents.length})</span>
                        </div>
                        <div className="space-y-2 min-h-[300px]">
                          {dayStudents.length === 0 ? (
                            <div className="text-center text-slate-400 text-xs py-10">일정 없음</div>
                          ) : (
                            dayStudents
                              .sort((a, b) => (a.timeSlot || '14:00').localeCompare(b.timeSlot || '14:00'))
                              .map(s => {
                                const isDone = (s.lessonCount || 0) >= 4;
                                return (
                                  <div key={s.id} className={`p-3 rounded-xl border shadow-2xs space-y-1.5 ${isDone ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-white border-slate-200 text-slate-800'}`}>
                                    <div className="flex justify-between items-center text-xs">
                                      <span className="font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">{s.timeSlot || '시간미정'}</span>
                                      <span className="text-xs font-bold text-slate-500">{s.lessonCount || 0}/4회</span>
                                    </div>
                                    <div className="font-bold text-sm truncate">{s.name}</div>
                                    <div className="text-[11px] text-slate-500 truncate">{s.course}</div>
                                    {!isTeacherMode && <div className="text-[10px] text-indigo-600 font-semibold">담당: {s.teacher}</div>}
                                  </div>
                                );
                              })
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'students' && (
            <div className="space-y-4 md:space-y-6">
              {!isTeacherMode && (
                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-2">
                  <span className="text-xs font-bold text-slate-500 block">🔗 선생님별 전용 개인 링크 (클릭 시 복사):</span>
                  <div className="flex flex-wrap gap-2">
                    {teacherList.filter(t => t !== '전체').map(t => (
                      <button
                        key={t}
                        onClick={() => {
                          const link = getTeacherLink(t);
                          navigator.clipboard.writeText(link);
                          alert(`[${t} 선생님] 전용 링크가 복사되었습니다!\n\n${link}`);
                        }}
                        className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
                      >
                        📋 {t} 선생님 링크 복사
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {!isTeacherMode && (
                <form onSubmit={addStudent} className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">수강생 성명</label>
                    <input type="text" placeholder="이름" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">연락처</label>
                    <input type="text" placeholder="010-0000-0000" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">과목 선택</label>
                    <select value={newStudent.course} onChange={e => setNewStudent({...newStudent, course: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm">
                      <option value="">과목을 선택하세요</option>
                      {(rules.courses || []).map(c => <option key={c.id} value={c.name}>[{c.teacher || '공통'}] {c.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">수업 요일</label>
                    <select value={newStudent.dayOfWeek} onChange={e => setNewStudent({...newStudent, dayOfWeek: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm">
                      {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-medium text-slate-500 mb-1 block">수업 시간</label>
                    <select value={newStudent.timeSlot} onChange={e => setNewStudent({...newStudent, timeSlot: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm">
                      {timeSlots.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                  <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-sm hover:bg-blue-700">수강생 등록</button>
                </form>
              )}

              <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-slate-900 text-base">원생 관리 대장 ({filteredStudents.length}명)</h3>
                  <span className="text-xs text-blue-600 font-medium">💡 학생 이름 클릭 시 상세기록, ✏️ 버튼 클릭 시 정보 수정 가능</span>
                </div>

                <div className="space-y-3">
                  {filteredStudents.map(s => {
                    const isDone = (s.lessonCount || 0) >= 4;
                    const isExpanded = expandedStudentId === s.id;
                    const isEditing = editingStudentId === s.id;

                    return (
                      <div key={s.id} className={`p-4 rounded-2xl border transition-all ${isDone ? "bg-rose-50/70 border-rose-200" : "bg-slate-50/50 border-slate-100"}`}>
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-2">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-base">
                              {s.name ? s.name[0] : '학'}
                            </div>
                            <div>
                              {isEditing ? (
                                <div className="flex flex-wrap gap-2 items-center">
                                  <input 
                                    type="text" 
                                    value={editStudentData.name !== undefined ? editStudentData.name : s.name} 
                                    onChange={e => setEditStudentData({...editStudentData, name: e.target.value})} 
                                    className="p-1.5 bg-white border rounded-lg text-xs w-24 font-bold"
                                    placeholder="이름"
                                  />
                                  <input 
                                    type="text" 
                                    value={editStudentData.phone !== undefined ? editStudentData.phone : s.phone} 
                                    onChange={e => setEditStudentData({...editStudentData, phone: e.target.value})} 
                                    className="p-1.5 bg-white border rounded-lg text-xs w-32"
                                    placeholder="연락처"
                                  />
                                  <select 
                                    value={editStudentData.dayOfWeek !== undefined ? editStudentData.dayOfWeek : s.dayOfWeek} 
                                    onChange={e => setEditStudentData({...editStudentData, dayOfWeek: e.target.value})}
                                    className="p-1.5 bg-white border rounded-lg text-xs"
                                  >
                                    {daysOfWeek.map(d => <option key={d} value={d}>{d}</option>)}
                                  </select>
                                  <select 
                                    value={editStudentData.timeSlot !== undefined ? editStudentData.timeSlot : s.timeSlot} 
                                    onChange={e => setEditStudentData({...editStudentData, timeSlot: e.target.value})}
                                    className="p-1.5 bg-white border rounded-lg text-xs"
                                  >
                                    {timeSlots.map(t => <option key={t} value={t}>{t}</option>)}
                                  </select>
                                  <button onClick={() => saveStudentEdit(s.id)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">저장</button>
                                  <button onClick={() => setEditingStudentId(null)} className="bg-slate-200 text-slate-700 px-2 py-1.5 rounded-lg text-xs">취소</button>
                                </div>
                              ) : (
                                <>
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <button 
                                      onClick={() => setExpandedStudentId(isExpanded ? null : s.id)}
                                      className="font-bold text-slate-900 text-base hover:text-blue-600 transition-colors text-left flex items-center gap-1"
                                    >
                                      {s.name} <span className="text-xs text-blue-500">▼</span>
                                    </button>
                                    <span className="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md font-medium">{s.teacher}</span>
                                    <span className="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-bold">📅 {s.dayOfWeek || '월요일'} {s.timeSlot || '14:00'}</span>
                                    
                                    {!isTeacherMode && (
                                      <button 
                                        onClick={() => { setEditingStudentId(s.id); setEditStudentData({name: s.name, phone: s.phone, dayOfWeek: s.dayOfWeek || '월요일', timeSlot: s.timeSlot || '14:00'}); }}
                                        className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded-md font-semibold transition-all"
                                      >
                                        ✏️ 수정
                                      </button>
                                    )}

                                    <div className="flex gap-1.5 items-center">
                                      <button 
                                        onClick={() => handleStartLesson(s.id)}
                                        className="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-bold transition-all"
                                      >
                                        ▶ 수업 시작
                                      </button>
                                      <button 
                                        onClick={() => handleEndLesson(s.id)}
                                        className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-bold transition-all"
                                      >
                                        ⏹ 수업 종료
                                      </button>
                                    </div>
                                  </div>
                                  <p className="text-xs text-slate-500 mt-0.5">{s.course} | 📞 {s.phone}</p>
                                </>
                              )}
                            </div>
                          </div>

                          <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                            <div className="flex items-center gap-1.5 bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                              <button onClick={() => updateLessonCount(s.id, -1)} className="w-7 h-7 bg-slate-100 rounded-lg font-bold text-slate-600 hover:bg-slate-200">-</button>
                              <span className="font-bold text-sm w-16 text-center">{s.lessonCount || 0} / 4 회</span>
                              <button onClick={() => updateLessonCount(s.id, 1)} className="w-7 h-7 bg-slate-100 rounded-lg font-bold text-slate-600 hover:bg-slate-200">+</button>
                            </div>

                            {isDone ? (
                              <span className="bg-rose-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold animate-pulse">
                                🚨 4회 완료 (결제 필요)
                              </span>
                            ) : (
                              <span className="bg-emerald-100 text-emerald-700 text-xs px-3 py-1.5 rounded-xl font-bold">
                                {4 - (s.lessonCount || 0)}회 남음
                              </span>
                            )}

                            {!isTeacherMode && isDone && (
                              <button onClick={() => resetLessonCount(s.id)} className="text-xs bg-slate-800 text-white px-2.5 py-1.5 rounded-xl font-medium">리셋</button>
                            )}
                            {!isTeacherMode && (
                              <button onClick={() => deleteStudent(s.id)} className="text-slate-400 hover:text-rose-500 text-xs">삭제</button>
                            )}
                          </div>
                        </div>

                        {isExpanded && (
                          <div className="mt-3 pt-3 border-t border-slate-200/80 bg-white p-4 rounded-2xl shadow-inner space-y-3">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex items-center justify-between">
                                <span className="font-bold text-slate-400">📅 수업 날짜:</span>
                                <span className="font-semibold text-slate-800">{s.lastAttendanceDate || '기록 없음'}</span>
                              </div>
                              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex items-center justify-between">
                                <span className="font-bold text-slate-400">🕒 수업 시작:</span>
                                <span className="font-semibold text-blue-600">{s.startTime || '-'}</span>
                              </div>
                              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex items-center justify-between">
                                <span className="font-bold text-slate-400">⏹ 수업 종료:</span>
                                <span className="font-semibold text-emerald-600">{s.endTime || '-'}</span>
                              </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                              <div className="space-y-1">
                                <label className="font-bold text-slate-500 block">📝 수업 내용 (진도):</label>
                                <input 
                                  type="text" 
                                  placeholder="오늘 진도 내용을 입력하세요..." 
                                  value={s.lessonNote || ''} 
                                  onChange={(e) => handleDetailChange(s.id, 'lessonNote', e.target.value)}
                                  className="w-full p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-slate-800 font-medium focus:bg-white focus:border-blue-500 focus:outline-none"
                                />
                              </div>
                              <div className="space-y-1">
                                <label className="font-bold text-slate-500 block">📌 비고 (특이사항):</label>
                                <input 
                                  type="text" 
                                  placeholder="특이사항을 입력하세요..." 
                                  value={s.note || ''} 
                                  onChange={(e) => handleDetailChange(s.id, 'note', e.target.value)}
                                  className="w-full p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-slate-800 font-medium focus:bg-white focus:border-blue-500 focus:outline-none"
                                />
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {activeTab === 'rules' && !isTeacherMode && (
            <div className="space-y-4 md:space-y-6">
              <form onSubmit={addCourse} className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">선생님 성함</label>
                  <input type="text" placeholder="예: 김드럼" value={newCourse.teacher} onChange={e => setNewCourse({...newCourse, teacher: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">과목명</label>
                  <input type="text" placeholder="과목명" value={newCourse.name} onChange={e => setNewCourse({...newCourse, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">4회 레슨비</label>
                  <input type="number" placeholder="원" value={newCourse.fee} onChange={e => setNewCourse({...newCourse, fee: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">회차/시간</label>
                  <input type="text" value={newCourse.hours} onChange={e => setNewCourse({...newCourse, hours: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-sm hover:bg-blue-700">과목 추가</button>
              </form>

              <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100">
                <h2 className="text-lg font-bold mb-4">선생님별 등록 과목 목록</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm min-w-[500px]">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="p-3.5">선생님</th>
                        <th className="p-3.5">과목명</th>
                        <th className="p-3.5">레슨 시간</th>
                        <th className="p-3.5 text-right">4회 수강료</th>
                        <th className="p-3.5 text-center">삭제</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {(rules.courses || []).map(c => (
                        <tr key={c.id}>
                          <td className="p-3.5 font-bold text-slate-700">{c.teacher || '공통'}</td>
                          <td className="p-3.5 font-semibold text-slate-800">{c.name}</td>
                          <td className="p-3.5 text-slate-600">{c.hours}</td>
                          <td className="p-3.5 text-right font-bold text-blue-600">{(c.fee || 0).toLocaleString()}원</td>
                          <td className="p-3.5 text-center"><button onClick={() => deleteCourse(c.id)} className="text-slate-400 hover:text-rose-500">삭제</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'ledger' && !isTeacherMode && (
            <div className="space-y-4 md:space-y-6">
              <form onSubmit={addLedger} className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">일자</label>
                  <input type="date" value={newLedger.date} onChange={e => setNewLedger({...newLedger, date: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">구분 / 수단</label>
                  <div className="flex gap-1">
                    <select value={newLedger.type} onChange={e => setNewLedger({...newLedger, type: e.target.value})} className="w-1/2 p-2.5 bg-slate-50 rounded-xl text-sm">
                      <option>수입</option>
                      <option>지출</option>
                    </select>
                    <select value={newLedger.method} onChange={e => setNewLedger({...newLedger, method: e.target.value})} className="w-1/2 p-2.5 bg-slate-50 rounded-xl text-sm">
                      <option>카드</option>
                      <option>계좌이체</option>
                      <option>현금</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">금액</label>
                  <input type="number" placeholder="원" value={newLedger.amount} onChange={e => setNewLedger({...newLedger, amount: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">적요</label>
                  <input type="text" placeholder="내역" value={newLedger.note} onChange={e => setNewLedger({...newLedger, note: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-sm hover:bg-blue-700">내역 등록</button>
              </form>

              <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100">
                <h3 className="font-bold text-slate-900 mb-4 text-base">회계 장부 내역 ({ledger.length}건)</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm min-w-[500px]">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="p-3.5">일자</th>
                        <th className="p-3.5">구분</th>
                        <th className="p-3.5">수단</th>
                        <th className="p-3.5">적요</th>
                        <th className="p-3.5 text-right">금액</th>
                        <th className="p-3.5 text-center">삭제</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {ledger.map(item => (
                        <tr key={item.id}>
                          <td className="p-3.5 text-slate-600">{item.date}</td>
                          <td className="p-3.5"><span className={`px-2 py-0.5 rounded text-xs font-semibold ${item.type === '수입' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>{item.type}</span></td>
                          <td className="p-3.5 text-slate-600">{item.method}</td>
                          <td className="p-3.5 font-medium">{item.note}</td>
                          <td className={`p-3.5 text-right font-bold ${item.type === '수입' ? 'text-emerald-600' : 'text-rose-600'}`}>{item.type === '수입' ? '+' : '-'}{(item.amount || 0).toLocaleString()}원</td>
                          <td className="p-3.5 text-center"><button onClick={() => deleteLedger(item.id)} className="text-slate-400 hover:text-rose-500">삭제</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'receipt' && !isTeacherMode && (
            <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100">
              <h3 className="font-bold text-slate-900 mb-4 text-base">교습비 수납 영수증 원부</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {ledger.filter(l => l.type === '수입').map(item => (
                  <div key={item.id} className="border border-slate-200 p-5 rounded-2xl space-y-2 bg-slate-50/30">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                      <span className="font-bold text-sm text-slate-800">교습비 납부 영수증 (보관용)</span>
                      <span className="text-xs text-slate-400">{item.date}</span>
                    </div>
                    <div className="text-xs space-y-1 text-slate-600">
                      <p>납부 수단: <span className="font-semibold text-slate-800">{item.method}</span></p>
                      <p>적요 내역: <span className="font-semibold text-slate-800">{item.note}</span></p>
                    </div>
                    <div className="pt-2 border-t border-slate-100 text-right">
                      <span className="text-xs text-slate-400 mr-2">영수금액</span>
                      <span className="text-base font-bold text-blue-600">{(item.amount || 0).toLocaleString()}원</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === 'staff' && !isTeacherMode && (
            <div className="space-y-4 md:space-y-6">
              <form onSubmit={addStaff} className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100 grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">강사 성명</label>
                  <input type="text" placeholder="이름" value={newStaff.name} onChange={e => setNewStaff({...newStaff, name: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">담당 과목</label>
                  <input type="text" placeholder="예: 드럼" value={newStaff.subject} onChange={e => setNewStaff({...newStaff, subject: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500 mb-1 block">채용일</label>
                  <input type="date" value={newStaff.hireDate} onChange={e => setNewStaff({...newStaff, hireDate: e.target.value})} className="w-full p-2.5 bg-slate-50 rounded-xl text-sm" />
                </div>
                <div className="flex gap-2 items-center text-xs font-medium text-slate-600 h-10">
                  <label className="flex items-center gap-1"><input type="checkbox" checked={newStaff.checkCrime} onChange={e => setNewStaff({...newStaff, checkCrime: e.target.checked})} /> 범죄경력</label>
                  <label className="flex items-center gap-1"><input type="checkbox" checked={newStaff.checkSex} onChange={e => setNewStaff({...newStaff, checkSex: e.target.checked})} /> 성범죄조회</label>
                </div>
                <button type="submit" className="bg-blue-600 text-white font-semibold p-2.5 rounded-xl text-sm hover:bg-blue-700">강사 등록</button>
              </form>

              <div className="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-900 text-base">직원/강사 관리 명부 ({staff.length}명)</h3>
                  <span className="text-xs text-blue-600 font-medium">💡 ✏️ 버튼을 눌러 언제든지 수정할 수 있습니다</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm min-w-[500px]">
                    <thead className="bg-slate-50 text-slate-500">
                      <tr>
                        <th className="p-3.5">성명</th>
                        <th className="p-3.5">직위</th>
                        <th className="p-3.5">담당 과목</th>
                        <th className="p-3.5">채용일</th>
                        <th className="p-3.5 text-center">성범죄/아동학대 전력조회</th>
                        <th className="p-3.5 text-center">수정 / 삭제</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {staff.map(st => {
                        const isEditing = editingStaffId === st.id;
                        return (
                          <tr key={st.id}>
                            <td className="p-3.5 font-bold text-slate-800">
                              {isEditing ? (
                                <input 
                                  type="text" 
                                  value={editStaffData.name !== undefined ? editStaffData.name : st.name} 
                                  onChange={e => setEditStaffData({...editStaffData, name: e.target.value})} 
                                  className="p-1 bg-white border rounded text-xs w-24 font-bold"
                                />
                              ) : st.name}
                            </td>
                            <td className="p-3.5 text-slate-600">
                              {isEditing ? (
                                <input 
                                  type="text" 
                                  value={editStaffData.role !== undefined ? editStaffData.role : st.role} 
                                  onChange={e => setEditStaffData({...editStaffData, role: e.target.value})} 
                                  className="p-1 bg-white border rounded text-xs w-20"
                                />
                              ) : st.role}
                            </td>
                            <td className="p-3.5 text-slate-600">
                              {isEditing ? (
                                <input 
                                  type="text" 
                                  value={editStaffData.subject !== undefined ? editStaffData.subject : st.subject} 
                                  onChange={e => setEditStaffData({...editStaffData, subject: e.target.value})} 
                                  className="p-1 bg-white border rounded text-xs w-24"
                                />
                              ) : st.subject}
                            </td>
                            <td className="p-3.5 text-slate-600">
                              {isEditing ? (
                                <input 
                                  type="date" 
                                  value={editStaffData.hireDate !== undefined ? editStaffData.hireDate : st.hireDate} 
                                  onChange={e => setEditStaffData({...editStaffData, hireDate: e.target.value})} 
                                  className="p-1 bg-white border rounded text-xs"
                                />
                              ) : st.hireDate}
                            </td>
                            <td className="p-3.5 text-center">
                              {isEditing ? (
                                <div className="flex gap-2 justify-center text-xs">
                                  <label><input type="checkbox" checked={editStaffData.checkCrime !== undefined ? editStaffData.checkCrime : st.checkCrime} onChange={e => setEditStaffData({...editStaffData, checkCrime: e.target.checked})} /> 범죄</label>
                                  <label><input type="checkbox" checked={editStaffData.checkSex !== undefined ? editStaffData.checkSex : st.checkSex} onChange={e => setEditStaffData({...editStaffData, checkSex: e.target.checked})} /> 성범죄</label>
                                </div>
                              ) : (
                                st.checkCrime && st.checkSex ? (
                                  <span className="bg-emerald-50 text-emerald-600 text-xs px-2.5 py-1 rounded-full font-semibold">회신 완료</span>
                                ) : (
                                  <span className="bg-rose-50 text-rose-600 text-xs px-2.5 py-1 rounded-full font-semibold">미완료</span>
                                )
                              )}
                            </td>
                            <td className="p-3.5 text-center space-x-1">
                              {isEditing ? (
                                <>
                                  <button onClick={() => saveStaffEdit(st.id)} className="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold">저장</button>
                                  <button onClick={() => setEditingStaffId(null)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs">취소</button>
                                </>
                              ) : (
                                <>
                                  <button onClick={() => { setEditingStaffId(st.id); setEditStaffData({name: st.name, role: st.role, subject: st.subject, hireDate: st.hireDate, checkCrime: st.checkCrime, checkSex: st.checkSex}); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-semibold">✏️ 수정</button>
                                  <button onClick={() => deleteStaff(st.id)} className="text-slate-400 hover:text-rose-500 text-xs">삭제</button>
                                </>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
